name: Paycrest Admin Service CI/CD

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'MANDATORY: Enter version (e.g., v1.2.3)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-validation:
    name: Security Scan Pipeline
    if: |
      (github.event_name == 'push' && github.ref_name == 'test') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Snyk Security Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: monitor

      - name: Build Local Image for Scanning
        run: docker build -t admin-service-scan:${{ github.sha }} .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'admin-service-scan:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  release-to-production:
    name: Build and Push to Docker Hub
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Version Tag
        id: tag_check
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag }}"
          if [[ ! $RAW_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid Tag Format. Please use v1.0.0"
            exit 1
          fi
          echo "FINAL_TAG=$RAW_TAG" >> $GITHUB_ENV

      - name: Final Build and Scan
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/paycrest-admin-service:${{ env.FINAL_TAG }} .

      - name: Trivy Critical Check
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/paycrest-admin-service:${{ env.FINAL_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/paycrest-admin-service:${{ env.FINAL_TAG }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/paycrest-admin-service:${{ env.FINAL_TAG }} ${{ secrets.DOCKER_USERNAME }}/paycrest-admin-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/paycrest-admin-service:latest

  notifications:
    name: Notifications
    needs: [security-and-validation, release-to-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Detailed Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && '❌ FAILED' || '✅ SUCCESS' }}: ${{ github.repository }} (Branch: ${{ github.ref_name }})"
          to: ${{ secrets.DEVELOPMENT_TEAM_EMAIL }}
          from: "Paycrest DevOps <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; border: 1px solid #ddd; border-radius: 10px; padding: 0;">
              <div style="background-color: ${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && '#d9534f' || '#5cb85c' }}; color: white; padding: 15px; border-radius: 10px 10px 0 0;">
                <h2 style="margin: 0;">Pipeline ${{ (needs.security-and-validation.result == 'failure' || needs.release-to-production.result == 'failure') && 'Failure' || 'Success' }}</h2>
              </div>
              
              <div style="padding: 20px;">
                <p><strong>Repository:</strong> ${{ github.repository }}</p>
                <p><strong>Commit:</strong> <code style="background: #eee; padding: 2px 5px;">${{ github.sha }}</code></p>
                <p><strong>Author:</strong> ${{ github.actor }}</p>
                
                <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                
                <h3 style="color: #333;">Critical Failure Point Detection:</h3>
                <ul style="list-style: none; padding: 0;">
                  <li style="margin-bottom: 10px; padding: 10px; border-left: 5px solid ${{ needs.security-and-validation.result == 'failure' ? '#d9534f' : '#5cb85c' }}; background: #f9f9f9;">
                    <strong>Step 1: Security & Validation</strong><br>
                    Status: ${{ needs.security-and-validation.result }} 
                    ${{ needs.security-and-validation.result == 'failure' && '⚠️ Check SonarQube or Dependency Logs' || '' }}
                  </li>
                  <li style="margin-bottom: 10px; padding: 10px; border-left: 5px solid ${{ needs.release-to-production.result == 'failure' ? '#d9534f' : '#5cb85c' }}; background: #f9f9f9;">
                    <strong>Step 2: Production Release</strong><br>
                    Status: ${{ needs.release-to-production.result || 'Not Started' }}
                    ${{ needs.release-to-production.result == 'failure' && '⚠️ Check Docker Build or Trivy Logs' || '' }}
                  </li>
                </ul>

                <div style="background: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; margin-top: 20px; font-size: 14px;">
                  <strong>Note:</strong> Log content is too large for email. Please click the button below to see the specific line-by-line failure in GitHub Actions.
                </div>

                <div style="margin-top: 25px; text-align: center;">
                  <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                     style="background-color: #333; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">
                    🔍 Troubleshoot Logs
                  </a>
                </div>
              </div>
              <div style="background: #f1f1f1; padding: 10px; text-align: center; font-size: 11px; color: #666;">
                Paycrest Admin Service CI/CD • Auto-generated
              </div>
            </div>